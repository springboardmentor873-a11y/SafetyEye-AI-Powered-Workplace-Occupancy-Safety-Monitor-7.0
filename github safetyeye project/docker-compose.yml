services:
  postgres:
    image: postgres:15
    container_name: safetyeye_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: safetyeye
      POSTGRES_USER: safetyeye
      POSTGRES_PASSWORD: safetyeye
    ports:
      - "5433:5432"
    volumes:
      - safetyeye_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safetyeye"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - safetyeye_net

  api:
    build: .
    container_name: safetyeye_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://safetyeye:safetyeye@postgres:5432/safetyeye
      WEIGHTS_PATH: weights/best.pt
      CONF_THRESH: "0.25"
      IOU_THRESH: "0.45"
    ports:
      - "8501:8501" # <-- Change 8000:8000 to 8501:8501
      - "8001:8001"
    volumes:
      - ./weights:/code/weights
    networks:
      - safetyeye_net

  grafana:
    image: grafana/grafana:10.4.2
    container_name: safetyeye_grafana
    restart: unless-stopped
    depends_on:
      - postgres
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: safetyeye_admin
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - safetyeye_grafana_data:/var/lib/grafana
    networks:
      - safetyeye_net

  prometheus:
    image: prom/prometheus:latest
    container_name: safetyeye_prometheus
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - safetyeye_net

volumes:
  safetyeye_pgdata:
  safetyeye_grafana_data:

networks:
  safetyeye_net:
    driver: bridge